name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: mypy -p cognivore

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # On Windows/macOS runners without a fully-configured C++ toolchain,
      # the native extension build may legitimately fail -- that's the
      # exact fallback path cognivore.index is designed to handle, so we
      # don't treat a failed extension build as a CI failure; the
      # native-only tests self-skip via `is_native` when that happens.
      - name: Install (build the native extension if possible)
        run: pip install -e ".[dev]"
        continue-on-error: true
      - name: Install (pure-Python fallback, if the native build failed)
        run: pip install -e ".[dev]" --no-build-isolation || pip install -e ".[dev]"
        if: failure()
      # Only on one leg of the matrix, and only best-effort: the video/OCR
      # tests in test_video.py self-skip via importorskip/shutil.which when
      # this isn't present, so a failure here (e.g. a transient apt mirror
      # issue) degrades to "skipped," not a broken build.
      - name: Install video extra + Tesseract (ubuntu/3.11 only, for real OCR coverage)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus
          pip install -e ".[video]"
        continue-on-error: true
      # Same idea for audio: test_audio.py's speech-recognition test needs
      # `faster-whisper` (downloads a small Whisper model from Hugging Face
      # on first use) and `espeak-ng` to synthesize the test speech; both
      # self-skip when unavailable, so this is best-effort too.
      - name: Install audio extra + espeak-ng (ubuntu/3.11 only, for real transcription coverage)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng
          pip install -e ".[audio]"
        continue-on-error: true
      - run: pytest --cov --cov-report=term-missing

  build-native-matrix:
    name: Native extension builds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade "setuptools>=77" pybind11 wheel
      - run: python setup.py build_ext --inplace
      - name: Smoke-test the extension
        working-directory: src
        run: python -c "from cognivore import _native; idx = _native.FlatIndex(4); idx.add(0, [1.0,0,0,0]); print(idx.search([1.0,0,0,0], 1))"

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: cognivore:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and hit /api/health
        run: |
          docker run -d --name cognivore-smoke -p 8420:8420 cognivore:ci
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8420/api/health; then echo; break; fi
            [ "$i" -eq 20 ] && { echo "server never came up"; docker logs cognivore-smoke; exit 1; }
            sleep 1
          done
      - name: Confirm the HEALTHCHECK itself reports healthy
        run: |
          for i in $(seq 1 20); do
            status="$(docker inspect -f '{{.State.Health.Status}}' cognivore-smoke)"
            [ "$status" = "healthy" ] && { echo "healthy"; exit 0; }
            sleep 2
          done
          echo "container never reported healthy (last status: $status)"; docker logs cognivore-smoke; exit 1
      - name: Confirm it's running as a non-root user
        run: |
          user="$(docker exec cognivore-smoke id -un)"
          echo "running as: $user"
          [ "$user" != "root" ]
      - if: always()
        run: docker rm -f cognivore-smoke || true
