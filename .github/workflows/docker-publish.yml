name: Publish Docker image

# Builds and pushes a multi-arch (amd64 + arm64) image to GitHub Container
# Registry whenever a version tag is pushed, or on demand. This is what
# turns "clone the repo and build it yourself" into "docker pull and
# run" -- no Python, no C++ toolchain, no OS-specific setup on the
# user's side at all, on an Intel/AMD machine or an ARM one (Apple
# Silicon, a Raspberry Pi) alike.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires an all-lowercase image path, but github.repository
      # preserves whatever case the repo was created with (this repo is
      # "Anton-Sergeev-EA/cognivore") -- GitHub Actions' expression syntax
      # has no built-in lower() function, so this is computed in a shell
      # step instead of inline in `env:`.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
