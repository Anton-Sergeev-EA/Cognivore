[build-system]
requires = ["setuptools>=68.0", "wheel", "pybind11>=2.12.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognivore"
version = "0.1.0"
description = "A local-first, torch-free multimodal agent framework: LLM reasoning + RAG, with a hand-written C++ accelerated vector index and a web chat UI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anton Sergeev", email = "avsergeev1981@gmail.com" }]
keywords = [
    "llm", "agent", "rag", "retrieval-augmented-generation", "vector-search",
    "ann", "hnsw", "pybind11", "cpp", "speech-to-text", "video-understanding",
    "local-first", "cpu-inference",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "fastembed>=0.3",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.2.90"]
audio = ["faster-whisper>=1.0"]
video = ["opencv-python-headless>=4.9", "pytesseract>=0.3.10"]
all = ["cognivore[llm,audio,video]"]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pybind11>=2.12",
]

[project.urls]
Homepage = "https://github.com/Anton-Sergeev-EA/cognivore"
Repository = "https://github.com/Anton-Sergeev-EA/cognivore"
Issues = "https://github.com/Anton-Sergeev-EA/cognivore/issues"

[project.scripts]
cognivore = "cognivore.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cognivore" = ["py.typed", "_native.pyi"]
"cognivore.web" = ["static/*"]
"cognivore.demo_content" = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `File(...)`/`Depends(...)` and Typer's `Argument(...)`/`Option(...)`
# as call-in-default-argument is the documented, idiomatic usage for both
# frameworks (they inspect the call at import time to build the route/CLI
# signature) -- not the mutable-default-argument footgun B008 warns about.
"src/cognivore/web/app.py" = ["B008"]
"src/cognivore/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["build", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/cognivore"]
